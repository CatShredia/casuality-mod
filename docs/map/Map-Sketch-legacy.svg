  <path class="river" d="M985,700 L986,770 L966,790"/>
  <text class="rl" x="990" y="722">Инди</text>
  <path class="river" d="M120,350 L130,420 L125,465"/>
  <text class="rl" x="135" y="395">Джинстон</text>

  <!-- подписи стран -->
  <text class="t tag big" x="1190" y="190">KRZ</text><text class="t" x="1190" y="208">Красная Земля</text>
  <text class="t tag" x="515" y="150">SVA</text><text class="t" x="515" y="166">Северная Ассамблея</text>
  <text class="t tag" x="372" y="360">ZLD</text><text class="t sm" x="372" y="374">Зеленодольск</text>
  <text class="t tag" x="345" y="500">SOY</text><text class="t" x="345" y="516">Соевая Республика</text>
  <text class="t tag" x="535" y="430">BTR</text><text class="t" x="535" y="446">Чёрная Тартария</text>
  <text class="t tag" x="480" y="545">ADL</text><text class="t sm" x="480" y="558">Айдалия</text>
  <text class="t tag" x="555" y="590">ZKR</text><text class="t sm" x="555" y="603">Закария</text>
  <text class="t tag" x="655" y="372">HRL</text><text class="t sm" x="655" y="385">Лига</text>
  <text class="t tag" x="740" y="372">FDP</text><text class="t sm" x="740" y="385">Федерация</text><text class="t sm" x="740" y="397">Депутатов</text>
  <text class="t tag" x="665" y="485">CRE</text><text class="t sm" x="665" y="498">Чёрная</text><text class="t sm" x="665" y="510">Республика</text>
  <text class="t tag" x="820" y="470">KZS</text><text class="t sm" x="820" y="483">Казачьи</text><text class="t sm" x="820" y="495">штаты</text>
  <text class="t tag" x="685" y="610">ZNS</text><text class="t sm" x="685" y="623">Зайнутдиновский</text><text class="t sm" x="685" y="635">Союз</text>
  <text class="t tag" x="815" y="605">DMK</text><text class="t sm" x="815" y="618">Дмитро-</text><text class="t sm" x="815" y="630">Княжество</text>
  <text class="t tag" x="935" y="590">ISL</text><text class="t sm" x="935" y="603">Исламская</text><text class="t sm" x="935" y="615">Республика</text>
  <text class="t tag" x="892" y="478">ART</text>
  <text class="t tag" x="962" y="470">VCI</text><text class="t sm" x="962" y="483">Казуалия</text>
  <text class="t tag" x="1050" y="405">CLB</text><text class="t sm" x="1050" y="418">Челяба</text>
  <text class="t tag" x="1240" y="405">ZML</text><text class="t sm" x="1240" y="418">Земля Замалия</text>
  <text class="t tag big" x="1190" y="570">SHF</text><text class="t" x="1190" y="588">Шарафутдиновская</text><text class="t" x="1190" y="603">Федерация</text>
  <text class="t tag" x="1440" y="555">NBL</text><text class="t sm" x="1440" y="568">Новая Булатия</text>
  <text class="t tag" x="1200" y="770">MUS</text><text class="t sm" x="1200" y="783">Королевство Муси</text>
  <text class="t sm" x="940" y="760">Иракиккистан</text>
  <text class="t sm" x="1045" y="790">Ирракия</text>
  <text class="t tag" x="1100" y="905">TRF</text><text class="t sm" x="1100" y="918" style="font-size:9px">Травинная Федерация</text>
  <text class="t tag" x="632" y="795">ISG</text>
  <text class="t tag" x="1437" y="728">KMS</text>
  <text class="t" x="130" y="415">Бриттан</text>
  <text class="t sm" x="50" y="298">Айцланд</text>

  <!-- компас -->
  <g transform="translate(1530,110)">
    <circle r="26" fill="#fff" stroke="#444"/>
    <path d="M0,-22 L6,0 L0,22 L-6,0 Z" fill="#c33"/>
    <text class="t" y="-30" style="font-size:13px;font-weight:700">С</text>
  </g>

  <!-- легенда -->
  <g transform="translate(20,860)">
    <rect width="520" height="170" rx="6" fill="#fff" stroke="#444" opacity="0.95"/>
    <text x="12" y="22" font-size="14" font-weight="700" fill="#111">LEGACY. Схема мира (по таблице 24 стран). Не в масштабе</text>
    <rect x="12" y="34" width="18" height="12" class="c dem"/><text x="36" y="45" font-size="12" fill="#111">демократия</text>
    <rect x="130" y="34" width="18" height="12" class="c com"/><text x="154" y="45" font-size="12" fill="#111">коммунизм</text>
    <rect x="240" y="34" width="18" height="12" class="c fas"/><text x="264" y="45" font-size="12" fill="#111">фашизм</text>
    <rect x="330" y="34" width="18" height="12" class="c neu"/><text x="354" y="45" font-size="12" fill="#111">нейтральные</text>
    <rect x="12" y="56" width="18" height="12" class="c brit"/><text x="36" y="67" font-size="12" fill="#111">Бриттан и колонии (нет в таблице стран)</text>
    <rect x="12" y="78" width="18" height="12" class="c" fill="#fff"/>
    <text x="36" y="89" font-size="12" fill="#111">сплошная рамка: положение следует из лора в документе</text>
    <rect x="12" y="100" width="18" height="12" class="c h" fill="#fff"/>
    <text x="36" y="111" font-size="12" fill="#111">пунктир: положение предложено, в документе его нет</text>
    <text x="12" y="132" font-size="11" fill="#444">Цвет по группе HOI4. Казуалия (VCI) заштрихована как болото.</text>
    <text x="12" y="150" font-size="11" fill="#444">Источник: docs/01-Contries-Description.md, docs/02-Geography.md</text>
  </g>
</svg>
