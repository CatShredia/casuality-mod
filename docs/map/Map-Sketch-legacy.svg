<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="swamp" width="10" height="8" patternUnits="userSpaceOnUse">
      <path d="M1 6 h3 M6 3 h3" stroke="#3f7f6a" stroke-width="1.4" fill="none"/>
    </pattern>
    <style>
      .c { stroke:#222; stroke-width:1.5; stroke-linejoin:round; }
      .h { stroke-dasharray:7 4; }
      .t { text-anchor:middle; font-size:12px; fill:#111; paint-order:stroke; stroke:#fff; stroke-width:3px; stroke-linejoin:round; }
      .tag { font-weight:700; font-size:14px; }
      .big { font-size:17px; }
      .sm { font-size:10px; }
      .sea { fill:#bcdcf0; stroke:#4a86b3; stroke-width:1.2; }
      .lbl { text-anchor:middle; font-style:italic; fill:#2c5d83; font-size:13px; paint-order:stroke; stroke:#cfe6f5; stroke-width:3px; }
      .river { fill:none; stroke:#3b82c4; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
      .rl { font-size:10px; fill:#1f5e99; font-style:italic; paint-order:stroke; stroke:#fff; stroke-width:2.5px; }
      .mtn { fill:none; stroke:#6b4a2b; stroke-width:3; stroke-dasharray:2 5; stroke-linecap:round; }
      .dem { fill:#7fa7e0; } .com { fill:#e07a74; } .fas { fill:#8a8a8a; } .neu { fill:#ecc65b; }
      .brit { fill:#b79ad0; }
    </style>
  </defs>

  <!-- океан -->
  <rect width="1600" height="1040" fill="#d9ecf8"/>
  <text class="lbl" x="150" y="600" font-size="16">Океан</text>
  <text class="lbl" x="560" y="42" font-size="16">Северный океан</text>

  <!-- острова Бриттана -->
  <polygon class="c brit" points="70,340 170,330 200,400 170,480 100,470 60,410"/>
  <polygon class="c brit" points="20,270 70,260 80,310 30,320"/>

  <!-- Запад -->
  <polygon class="c dem" points="250,400 440,400 440,610 380,630 300,640 250,600"/> <!-- SOY -->
  <polygon class="c dem" points="300,330 445,330 445,400 300,400"/> <!-- ZLD -->
  <polygon class="c fas" points="445,330 620,330 630,430 620,520 560,520 445,520"/> <!-- BTR -->
  <polygon class="c dem" points="440,520 520,520 520,580 440,580"/> <!-- ADL -->
  <polygon class="c dem h" points="520,520 620,520 630,610 580,720 530,700 470,640 440,610 440,580 520,580"/> <!-- ZKR -->
  <polygon class="c dem h" points="620,320 690,320 690,430 630,430"/> <!-- HRL -->
  <polygon class="c neu" points="690,320 790,320 790,430 690,430"/> <!-- FDP -->

  <!-- Север -->
  <polygon class="c dem" points="330,70 700,70 700,300 330,300"/> <!-- SVA -->
  <polygon class="c com" points="700,70 1450,70 1450,310 1380,330 1240,350 1100,350 1000,350 1000,440 925,440 860,430 790,430 790,330 745,325 700,250"/> <!-- KRZ -->
  <polygon fill="url(#swamp)" opacity="0.7" points="1010,150 1150,150 1150,335 1010,335"/>

  <!-- Юго-запад / Кавказ -->
  <polygon class="c fas h" points="630,430 775,430 775,545 640,545 620,520"/> <!-- CRE -->
  <polygon class="c neu" points="775,430 860,430 860,545 790,545 775,530"/> <!-- KZS -->
  <polygon class="c neu h" points="630,545 740,545 740,640 700,720 660,715 630,640"/> <!-- ZNS -->
  <polygon class="c fas h" points="740,545 860,545 870,650 780,670 740,640"/> <!-- DMK -->
  <polygon class="c neu h" points="860,545 925,510 1000,510 1000,600 980,690 900,710 870,650"/> <!-- ISL -->

