  <polygon class="c brit" points="900,710 980,690 990,780 930,810 880,770"/> <!-- Иракиккистан -->
  <polygon class="c brit" points="980,690 1090,690 1110,760 1040,860 990,780"/> <!-- Ирракия -->
  <polygon class="c dem" points="1090,690 1250,690 1300,740 1270,830 1200,860 1130,810 1110,760"/> <!-- MUS -->
  <polygon class="c com" points="1020,880 1130,870 1160,900 1060,920"/> <!-- TRF -->
  <polygon class="c com" points="1160,890 1260,880 1280,920 1190,930"/>
  <polygon class="c com" points="1300,860 1345,870 1335,912"/>
  <polygon class="c com h" points="590,770 650,760 670,800 620,820"/> <!-- ISG -->
  <polygon class="c dem h" points="1400,700 1450,690 1470,740 1420,760"/> <!-- KMS -->
  <polygon class="c dem h" points="1440,780 1480,800 1450,830"/>

  <!-- моря (поверх суши) -->
  <polygon class="sea" points="290,255 470,262 560,272 650,255 720,285 745,330 700,345 560,342 460,335 290,340"/>
  <polygon class="sea" points="700,455 735,440 775,455 780,500 755,535 715,530 700,500"/>
  <text class="lbl" x="520" y="302">Синее море</text>
  <text class="lbl" style="font-size:10px" x="740" y="492">Кряхтское</text>
  <text class="lbl" style="font-size:10px" x="740" y="504">море</text>
  <text class="lbl" x="420" y="700">Среднее море</text>

  <!-- горы -->
  <path class="mtn" d="M990,120 L1000,230 L1000,345"/>
  <path class="mtn" d="M778,546 L860,546"/>
  <text class="rl" x="1004" y="130">Урурские горы</text>
  <text class="rl" x="790" y="563">Куштунский хребет</text>
  <text class="rl" x="1040" y="245" style="fill:#2f6b57">Наши Болота</text>
  <text x="944" y="454" font-size="8" fill="#6b4a2b" text-anchor="middle">▲▲▲</text>

  <!-- реки -->
  <path class="river" d="M962,440 L960,350 L965,200 L960,70"/>
  <text class="rl" x="970" y="180">р. Казуахия</text>
  <path class="river" d="M835,335 L822,395 L792,430 L772,452"/>
  <text class="rl" x="812" y="365">Димитров</text>
  <path class="river" d="M1280,120 L1340,220 L1440,300"/>
