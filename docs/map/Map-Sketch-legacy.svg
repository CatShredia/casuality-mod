  <polygon class="c neu h" points="860,430 925,440 925,510 860,545"/> <!-- ART -->
  <polygon class="c neu" points="925,440 1000,440 1000,510 925,510"/> <!-- VCI -->
  <polygon fill="url(#swamp)" points="925,440 1000,440 1000,510 925,510"/>
  <polygon class="c neu h" points="1000,350 1100,350 1100,470 1000,470"/> <!-- CLB -->
  <polygon class="c com h" points="1100,350 1240,350 1380,330 1380,470 1100,470"/> <!-- ZML -->
  <polygon class="c neu h" points="1000,470 1380,470 1380,640 1250,690 1090,690 980,690 1000,600 1000,510"/> <!-- SHF -->
  <polygon class="c neu h" points="1380,470 1470,490 1500,560 1450,640 1380,640"/> <!-- NBL -->

